services:
  - type: web
    name: habitasmart
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: habitasmart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: habitasmart-db
    plan: free
    databaseName: habitasmart
    user: habitasmart
